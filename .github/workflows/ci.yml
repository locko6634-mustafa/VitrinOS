name: CI

on:
  push:
  pull_request:

concurrency:
  group: vitrin-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/vitrinos-http.log 2>&1 &
          for attempt in {1..10}; do
            if curl --silent --fail http://localhost:8000/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vitrinos-http.log
          exit 1
      - run: npm run check
      # Drizzle's current advisory has no upstream fix; keep reporting it while
      # blocking the build only for critical vulnerabilities.
      - run: npm audit --audit-level=critical
