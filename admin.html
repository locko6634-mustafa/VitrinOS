<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yönetim paneli | VitrinOS</title>
    <meta name="description" content="VitrinOS markalar, kullanıcılar, başvurular ve yapay zeka promptları yönetim paneli.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" fill="%23f8f4ec"/%3E%3Cpath d="M11 15h11l10 30 10-30h11L38 53H26L11 15Z" fill="%231d1e22"/%3E%3Cpath d="M46 42h9v9h-9z" fill="%23f46b22"/%3E%3C/svg%3E'>
    <link rel="stylesheet" href="css/style.css?v=2.1">
    <link rel="stylesheet" href="css/dashboard.css?v=2.1">
    <link rel="stylesheet" href="css/admin.css?v=2.3">
  </head>
  <body class="app-body admin-body" data-surface="admin">
    <a class="skip-link" href="#admin-main">İçeriğe geç</a>

    <div class="app-shell" id="appShell">
      <header class="app-topbar">
        <button class="app-menu-toggle" id="appMenuToggle" type="button" aria-expanded="false" aria-controls="dashboardNav" aria-label="Menüyü aç">
          <span class="menu-toggle-box" aria-hidden="true">
            <span class="menu-toggle-inner"></span>
          </span>
        </button>

        <a class="brand app-brand" href="index.html" aria-label="VitrinOS ana sayfa">
          <span class="brand-word">Vitrin</span><span class="brand-os">OS</span><sup class="brand-reg" aria-hidden="true">®</sup>
        </a>

        <div class="app-topbar-actions">
          <span class="badge badge-admin">Sistem Yöneticisi</span>
          <button class="button secondary compact-button" type="button" data-dashboard-logout>Çıkış yap</button>
        </div>
      </header>

      <div class="app-menu-scrim" id="appMenuScrim" tabindex="-1" aria-hidden="true"></div>

      <div class="app-layout">
        <nav class="app-rail" id="dashboardNav" aria-label="Yönetim menüsü">
          <ul class="nav-list" role="tablist" aria-label="Yönetim sekmeleri">
            <li role="presentation">
              <button class="nav-button is-active" id="admin-tab-brands" role="tab" aria-selected="true" aria-controls="admin-panel-brands" data-admin-tab="brands">
                <span class="nav-icon" aria-hidden="true">🏢</span>
                <span class="nav-text">Markalar & Promptlar</span>
              </button>
            </li>
            <li role="presentation">
              <button class="nav-button" id="admin-tab-users" role="tab" aria-selected="false" aria-controls="admin-panel-users" data-admin-tab="users">
                <span class="nav-icon" aria-hidden="true">👥</span>
                <span class="nav-text">Kullanıcılar</span>
              </button>
            </li>
            <li role="presentation">
              <button class="nav-button" id="admin-tab-leads" role="tab" aria-selected="false" aria-controls="admin-panel-leads" data-admin-tab="leads">
                <span class="nav-icon" aria-hidden="true">📋</span>
                <span class="nav-text">Başvurular</span>
              </button>
            </li>
            <li role="presentation">
              <button class="nav-button" id="admin-tab-jobs" role="tab" aria-selected="false" aria-controls="admin-panel-jobs" data-admin-tab="jobs">
                <span class="nav-icon" aria-hidden="true">⚡</span>
                <span class="nav-text">İş Takibi</span>
              </button>
            </li>
          </ul>

          <div class="app-rail-footer">
            <a class="nav-button-link" href="dashboard.html">
              <span class="nav-icon" aria-hidden="true">←</span>
              <span class="nav-text">Çalışma alanına dön</span>
            </a>
          </div>
        </nav>

        <main class="app-main" id="admin-main">
          <section class="admin-panel is-active" id="admin-panel-brands" role="tabpanel" aria-labelledby="admin-tab-brands" data-admin-panel="brands">
            <div class="admin-toolbar">
              <label class="admin-search">
                <span>Marka ara</span>
                <input id="brandSearch" type="search" placeholder="Marka adı veya kullanıcı">
              </label>
              <button class="button secondary compact-button" type="button" id="newBrandButton">Yeni marka</button>
            </div>

            <div class="admin-grid-with-detail">
              <article class="admin-card admin-table-card">
                <div class="admin-card-head">
                  <span>Marka listesi</span>
                  <strong id="brandCount">0 marka</strong>
                </div>
                <div class="admin-table-wrap">
                  <table class="admin-table">
                    <thead>
                      <tr>
                        <th>Marka</th>
                        <th>Web sitesi</th>
                        <th>Tarih</th>
                        <th>İşlemler</th>
                      </tr>
                    </thead>
                    <tbody id="brandRows"></tbody>
                  </table>
                </div>
              </article>

              <form class="admin-card admin-form-card" id="brandForm" novalidate>
                <div class="admin-card-head">
                  <span>Marka ekle / düzenle</span>
                  <strong id="brandFormTitle">Yeni marka</strong>
                </div>
                <div class="admin-form-grid">
                  <label>Marka adı<input name="name" id="brandName" required></label>
                  <label>Web sitesi<input name="websiteUrl" id="brandWebsite" type="url"></label>
                </div>
                <button class="button primary" type="submit">Markayı kaydet</button>
                <p class="form-status" id="brandStatus" role="status" aria-live="polite"></p>
              </form>
            </div>
          </section>

          <section class="admin-panel" id="admin-panel-users" role="tabpanel" aria-labelledby="admin-tab-users" data-admin-panel="users" hidden>
            <article class="admin-card admin-table-card">
              <div class="admin-card-head"><span>Kullanıcı yönetimi</span><strong id="userCount">0 kullanıcı</strong></div>
              <div class="admin-table-wrap">
                <table class="admin-table">
                  <thead><tr><th>E-posta</th><th>Rol</th><th>Durum</th><th>Kayıt tarihi</th><th>İşlemler</th></tr></thead>
                  <tbody id="userRows"></tbody>
                </table>
              </div>
            </article>
          </section>

          <section class="admin-panel" id="admin-panel-jobs" role="tabpanel" aria-labelledby="admin-tab-jobs" data-admin-panel="jobs" hidden>
            <article class="admin-card admin-table-card">
              <div class="admin-card-head"><span>İş takibi</span><strong id="jobCount">0 iş</strong></div>
              <div class="admin-table-wrap">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>Brief</th>
                      <th>Format</th>
                      <th>Durum</th>
                      <th>Saat</th>
                    </tr>
                  </thead>
                  <tbody id="jobRows"></tbody>
                </table>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>

    <script src="js/config.js?v=1.1"></script>
    <script src="js/observability.js?v=1.1"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth-store.js"></script>
    <script src="js/admin.js?v=2.3"></script>
  </body>
</html>
