default_permissions = "local_browser"

[allowed_permission_profiles]
":read-only" = true
":workspace" = true
local_browser = true

[permissions.local_browser]
description = "Workspace erisimi ile local browser hedeflerine izin verir."
extends = ":workspace"

[permissions.local_browser.network]
enabled = true
allow_local_binding = true

[permissions.local_browser.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"[::1]" = "allow"
"::1" = "allow"
